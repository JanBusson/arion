name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: arion_test
          POSTGRES_USER: arion
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arion -d arion_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ARION_DATABASE_URL: postgresql+psycopg://arion:test-only-password@127.0.0.1:5432/arion_test
      ARION_TEST_DATABASE_URL: postgresql+psycopg://arion:test-only-password@127.0.0.1:5432/arion_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and media tools
        run: |
          uv python install 3.13
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install locked dependencies
        run: uv sync --frozen --project backend

      - name: Verify migrations in both directions
        run: |
          uv run --frozen --project backend alembic -c backend/alembic.ini upgrade head
          uv run --frozen --project backend alembic -c backend/alembic.ini downgrade base
          uv run --frozen --project backend alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        run: uv run --frozen --project backend pytest backend/tests

  backend-image:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: arion-api:ci
