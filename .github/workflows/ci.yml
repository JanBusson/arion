name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: arion_test
          POSTGRES_USER: arion
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arion -d arion_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ARION_DATABASE_URL: postgresql+psycopg://arion:test-only-password@127.0.0.1:5432/arion_test
      ARION_TEST_DATABASE_URL: postgresql+psycopg://arion:test-only-password@127.0.0.1:5432/arion_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and media tools
        run: |
          uv python install 3.13
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install locked dependencies
        run: uv sync --frozen --project backend

      - name: Verify migrations in both directions
        run: |
          uv run --frozen --project backend alembic -c backend/alembic.ini upgrade head
          uv run --frozen --project backend alembic -c backend/alembic.ini downgrade base
          uv run --frozen --project backend alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        run: uv run --frozen --project backend pytest backend/tests

  flutter-client:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build web client
        run: flutter build web --release --no-web-resources-cdn

  backend-image:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: arion-api:ci

  web-gateway:
    name: Production web gateway
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify default Compose model
        run: docker compose config --format json | python scripts/verify_compose_config.py

      - name: Verify private-LAN Compose override
        env:
          ARION_WEB_BIND_ADDRESS: 192.0.2.10
          ARION_WEB_PORT: "18080"
        run: >-
          docker compose config --format json |
          python scripts/verify_compose_config.py
          --expected-web-host 192.0.2.10
          --expected-web-port 18080

      - name: Build and start production stack
        run: docker compose up --detach --build --wait --wait-timeout 240

      - name: Inspect minimal unprivileged runtime
        run: |
          test "$(docker image inspect arion-web:local --format '{{.Config.User}}')" = "101:101"
          docker run --rm --entrypoint sh arion-web:local -ec '
            test -s /usr/share/nginx/html/index.html
            test ! -e /opt/flutter
            test ! -e /src
            test ! -e /.git
            test ! -e /.env
            test ! -e /root/.pub-cache
          '

      - name: Verify static, proxy, cache, health, and range behavior
        run: >-
          python scripts/verify_web_gateway.py
          --base-url http://127.0.0.1:8080
          --direct-api-url http://127.0.0.1:8000

      - name: Verify unavailable API response
        run: |
          docker compose stop api
          python scripts/verify_web_gateway.py \
            --base-url http://127.0.0.1:8080 \
            --expect-api-unavailable

      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color db migrate api web

      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
