[project]
name = "arion-api"
version = "0.1.0"
description = "Backend API for the Arion self-hosted music application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "mutagen>=1.47,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
    "ytmusicapi==1.12.2",
    "yt-dlp[default]==2026.8.19",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.4,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arion_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
