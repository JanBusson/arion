resolver 127.0.0.11 valid=10s ipv6=off;

upstream arion_api {
    zone arion_api 64k;
    server api:8000 resolve;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

    location ^~ /api/ {
        proxy_pass http://arion_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://arion_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /ready {
        proxy_pass http://arion_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:index\.html|flutter(?:_bootstrap|_service_worker)?\.js|main\.dart\.js|manifest\.json|version\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ^~ /canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:bin|css|frag|gif|ico|jpe?g|js|json|map|mjs|otf|png|svg|symbols|ttf|txt|wasm|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
